# Multi-Node CAI Ray Cluster Configuration Example
# One large head node + multiple GPU worker nodes.
# Scale worker count via num_workers or RAY_NUM_WORKERS env var.
#
# All resource values are picked up by load_config() in
# cai_integration/launch_ray_cluster.py.  Environment variables override
# anything set here (RAY_HEAD_CPU, RAY_WORKER_GPUS, etc.).

ray_cluster:

  # ── Cluster topology ──────────────────────────────────────────────────────
  num_workers: 4   # one head + four GPU workers

  # ── Head node resources ───────────────────────────────────────────────────
  # The head node runs Ray GCS, the Ray Dashboard, the Management API, and
  # nginx.  It is CPU-only — GPUs are reserved for worker nodes.
  # Size the head node to comfortably host the Management API alongside Ray GCS.
  head_cpu:    16
  head_memory: 64   # GB

  # ── Management API resources (Ray Serve deployment on the head node) ──────
  # Must not exceed head_cpu / head_memory.
  management_api_cpu:    8   # = head_cpu // 2
  management_api_memory: 32  # GB  = head_memory // 2

  # ── Worker node resources ─────────────────────────────────────────────────
  # Each worker is an independent CAI application.
  # Increase worker_gpus for tensor-parallel shards within a single worker.
  worker_cpu:    32
  worker_memory: 128  # GB
  worker_gpus:   4    # GPUs per worker (e.g. 4× A100 for tensor parallelism)

  # ── Ray daemon ports ──────────────────────────────────────────────────────
  ray_port:       6379
  dashboard_port: 8265

# ── CAI / CML Application configuration ──────────────────────────────────────
cai:
  # Worker nodes use a CUDA runtime; head node uses the standard runtime.
  # launch_ray_cluster.py selects the right image per node type via
  # HEAD_RUNTIME_IDENTIFIER / WORKER_RUNTIME_IDENTIFIER env vars.
  runtime_identifier: "docker.repository.cloudera.com/cloudera/cdsw/ml-runtime-pbj-jupyterlab-python3.11-cuda:2025.09.1-b5"

  project_name: "ray-cluster"

# ── Optional per-job environment variables ────────────────────────────────────
# Passed through to every CAI application (head + workers).
environment:
  # VLLM_TENSOR_PARALLEL_SIZE: "4"   # match worker_gpus for intra-node TP
  # VLLM_PIPELINE_PARALLEL_SIZE: "4" # match num_workers for inter-node PP
  {}
