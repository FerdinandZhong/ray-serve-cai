# =============================================================================
# AMP (Applied ML Prototype) project metadata
#
# This manifest makes the repo a one-click deployable Cloudera AMP:
# importing it creates and runs the same CML job chain that
# `cai_integration/create_jobs.py` + GitHub Actions run imperatively
# (see cai_integration/jobs_config.yaml for the source of truth on
# resources; this manifest expresses job timeouts in minutes).
#
#   Stage 1  configure_project_resources  set project /dev/shm for Ray applications
#   Stage 2  setup_base_env       /home/cdsw/.venv        (ray + core, no engines)
#   Stage 3  setup_vllm_env       /home/cdsw/.venv-vllm   (vllm + ninja)
#   Stage 4  setup_litellm_env    /home/cdsw/.venv-litellm
#   Stage 5  launch_ray_cluster   head only, Management API up
#   Stage 6  launch_monitoring    Prometheus + Grafana CML apps
#   Stage 7  amp_llm_demo         created for manual execution after a worker is added
#
# Workbench-injected vars (CDSW_DOMAIN, CDSW_APIV2_KEY, CDSW_PROJECT_ID,
# CDSW_APP_*) are available to every task at runtime and are therefore NOT
# declared below — only user-configurable values are prompted at import.
# If the Workbench form serializes edited inputs as browser events, use the
# input-safe API import in docs/AMP_INPUT_SAFE_IMPORT.md. Do not replace user
# resource choices with defaults or flatten this manifest's definition objects.
#
# After import, open:
#   https://ray-cluster-head.<CDSW_DOMAIN>/          (chat UI)
#   https://ray-cluster-head.<CDSW_DOMAIN>/docs      (Swagger — Management API)
# =============================================================================

name: Ray Cluster on CAI for Micro Services
description: >-
  Multi-engine model inference on Cloudera AI Workbench: a Ray cluster
  (head + user-provisioned workers) behind a single Management REST API, with vLLM and
  LiteLLM engines in isolated virtualenvs, declarative GPU placement, and
  Prometheus/Grafana monitoring. Import starts no workers; use the API to add
  your own worker node type, then run the optional demo job.
author: Cloudera Engineering
date: '2026-09-16'
specification_version: "1.0"
prototype_version: "1.0"

# Match the Python minor used by the configured head/worker runtime images.
runtimes:
  - editor: JupyterLab
    kernel: Python 3.11
    edition: Standard

environment_variables:
  VLLM_MODEL_ID:
    default: "Qwen/Qwen3.8-27B-FP8"
    description: >-
      HuggingFace model ID deployed by the demo task (open models only,
      or pair with HUGGING_FACE_HUB_TOKEN for gated models).
    required: false
  TENSOR_PARALLEL_SIZE:
    default: "2"
    description: Tensor-parallel size for the demo deployment (2 = one dual-GPU worker).
    required: false
  RAY_HEAD_CPU:
    default: "12"
    description: CPU cores requested for the Ray head CML Application.
    required: false
  RAY_HEAD_MEMORY:
    default: "32"
    description: Memory in GB requested for the Ray head CML Application.
    required: false
  RAY_SHARED_MEMORY_LIMIT_MB:
    default: "40000"
    description: >-
      Project-wide /dev/shm limit in MB for newly created CAI applications.
      Ray workers require this to hold the plasma object store in shared memory.
    required: false
  RAY_WORKER_NODE_TYPE:
    default: "gpu-worker"
    description: >-
      Demo deployment target label only. After the head starts, define this
      node type and its resources through Swagger, then explicitly add workers.
  HUGGING_FACE_HUB_TOKEN:
    default: ""
    description: HF token for gated models (leave blank for open-weights models).
    required: false

tasks:
  # ── Stage 1: project shared memory ─────────────────────────────────────────
  - type: create_job
    name: configure_project_resources
    entity_label: amp-configure-project-resources
    script: cai_integration/configure_project_resources.py
    kernel: python3
    cpu: 1
    memory: 2
    timeout: 5
    description: "Set and verify project /dev/shm limit before creating Ray applications"
  - type: run_job
    entity_label: amp-configure-project-resources
    wait_for: true

  # ── Stage 2: base venv ─────────────────────────────────────────────────────
  - type: create_job
    name: setup_base_env
    entity_label: amp-setup-base-env
    script: cai_integration/setup_environment.py
    kernel: python3
    cpu: 4
    memory: 16
    timeout: 15
    description: "Create /home/cdsw/.venv with Ray and core deps (no inference engines)"
  - type: run_job
    entity_label: amp-setup-base-env
    wait_for: true

  # ── Stage 3: vLLM venv ─────────────────────────────────────────────────────
  - type: create_job
    name: setup_vllm_env
    entity_label: amp-setup-vllm-env
    script: cai_integration/setup_vllm_env.py
    kernel: python3
    cpu: 4
    memory: 16
    timeout: 30
    description: "Create /home/cdsw/.venv-vllm with vllm + ninja"
  - type: run_job
    entity_label: amp-setup-vllm-env
    wait_for: true

  # ── Stage 4: LiteLLM venv ──────────────────────────────────────────────────
  - type: create_job
    name: setup_litellm_env
    entity_label: amp-setup-litellm-env
    script: cai_integration/setup_litellm_env.py
    kernel: python3
    cpu: 2
    memory: 8
    timeout: 10
    description: "Create /home/cdsw/.venv-litellm with litellm"
  - type: run_job
    entity_label: amp-setup-litellm-env
    wait_for: true

  # ── Stage 5: Ray cluster (head + workers + Management API) ─────────────────
  - type: create_job
    name: launch_ray_cluster
    entity_label: amp-launch-ray-cluster
    script: cai_integration/launch_ray_cluster_job.py
    kernel: python3
    cpu: 2
    memory: 8
    timeout: 20
    description: "Start only the Ray head; define and launch worker types later through Swagger"
  - type: run_job
    entity_label: amp-launch-ray-cluster
    wait_for: true

  # ── Stage 6: monitoring ────────────────────────────────────────────────────
  - type: create_job
    name: launch_monitoring
    entity_label: amp-launch-monitoring
    script: cai_integration/launch_monitoring_job.py
    kernel: python3
    cpu: 2
    memory: 8
    timeout: 15
    description: "Create Prometheus + Grafana CML apps and provision Ray dashboards"
  - type: run_job
    entity_label: amp-launch-monitoring
    wait_for: true

  # ── Stage 7: manual LLM demo ───────────────────────────────────────────────
  # Deliberately created but not run: import allocates no worker capacity.
  # Add a worker via Swagger, then run this job to deploy and query VLLM_MODEL_ID.
  - type: create_job
    name: amp_llm_demo
    entity_label: amp-llm-demo
    script: cai_integration/amp_demo.py
    kernel: python3
    cpu: 1
    memory: 2
    gpu: 0
    timeout: 45
