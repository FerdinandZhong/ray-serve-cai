# Multi-Node CAI Ray Cluster Configuration Example
# One large head node + multiple GPU worker nodes.
# Scale worker count via num_workers or RAY_NUM_WORKERS env var.
#
# All resource values are picked up by load_config() in
# cai_integration/launch_ray_cluster.py.  Environment variables override
# anything set here (RAY_HEAD_CPU, RAY_WORKER_GPUS, etc.).

ray_cluster:

  # ── Cluster topology ──────────────────────────────────────────────────────
  # num_workers is derived from the sum of worker_groups[].count when
  # worker_groups is present.  Set it here only for simple single-group mode.
  num_workers: 4

  # ── Head node resources ───────────────────────────────────────────────────
  # The head node runs Ray GCS, the Ray Dashboard, the Management API, and
  # nginx.  It is CPU-only — GPUs are reserved for worker nodes.
  # Size the head node to comfortably host the Management API alongside Ray GCS.
  head_cpu:    16
  head_memory: 64   # GB

  # ── Management API resources (Ray Serve deployment on the head node) ──────
  # Must not exceed head_cpu / head_memory.
  management_api_cpu:    8   # = head_cpu // 2
  management_api_memory: 32  # GB  = head_memory // 2

  # ── Worker node resources (simple single-group config) ────────────────────
  # Used only when worker_groups is absent.  Ignored when worker_groups is set.
  worker_cpu:         32
  worker_memory:      128   # GB
  worker_gpus:        4
  worker_node_type:   "gpu-worker"   # default label; overridden by worker_groups

  # ── Worker groups (advanced heterogeneous config) ─────────────────────────
  # When present, takes priority over num_workers / worker_cpu / worker_gpus.
  # Each group becomes its own set of CAI applications.  The node_type value
  # is registered as a Ray resource "node_type:<node_type>" at ray start time,
  # which coordinator._detect_node_type() reads without any static registry.
  #
  # Free-form node_type labels — name them to reflect hardware or role:
  #   "cpu-worker"            — CPU-only inference or preprocessing
  #   "t4_gpu_node_single"    — single NVIDIA T4
  #   "l40_gpu_node_2_gpus"   — dual NVIDIA L40
  #   "a100_80g_node_4_gpus"  — 4× A100 80 GB
  worker_groups:
    - name:         "t4-inference"
      node_type:    "t4_gpu_node_single"
      count:        2
      cpu:          16
      memory:       64    # GB
      gpus:         1
      # runtime_identifier: "..."   # optional override; defaults to worker runtime

    - name:         "l40-training"
      node_type:    "l40_gpu_node_2_gpus"
      count:        2
      cpu:          32
      memory:       128   # GB
      gpus:         2

  # ── Ray daemon ports ──────────────────────────────────────────────────────
  ray_port:       6379
  dashboard_port: 8265

# ── CAI / CML Application configuration ──────────────────────────────────────
cai:
  # Worker nodes use a CUDA runtime; head node uses the standard runtime.
  # launch_ray_cluster.py selects the right image per node type via
  # HEAD_RUNTIME_IDENTIFIER / WORKER_RUNTIME_IDENTIFIER env vars.
  runtime_identifier: "docker.repository.cloudera.com/cloudera/cdsw/ml-runtime-pbj-jupyterlab-python3.11-cuda:2026.01.1-b6"

  project_name: "ray-cluster"

# ── Optional per-job environment variables ────────────────────────────────────
# Passed through to every CAI application (head + workers).
environment:
  # VLLM_TENSOR_PARALLEL_SIZE: "4"   # match worker_gpus for intra-node TP
  # VLLM_PIPELINE_PARALLEL_SIZE: "4" # match num_workers for inter-node PP
  {}
