# Ray Cluster Configuration for CML/CAI Deployment
#
# All resource values are picked up by load_config() in
# cai_integration/launch_ray_cluster.py.  Environment variables override
# anything set here (RAY_HEAD_CPU, RAY_WORKER_GPUS, etc.).

ray_cluster:

  # ── Head node resources ───────────────────────────────────────────────────
  # The head node runs Ray GCS, the Ray Dashboard, the Management API, and
  # nginx.  It is CPU-only — GPUs are reserved for worker nodes.
  head_cpu:    8
  head_memory: 32   # GB

  # ── Management API resources (Ray Serve deployment on the head node) ──────
  # Defaults: half of head_cpu / head_memory when omitted.
  # Must not exceed head_cpu / head_memory.
  management_api_cpu:    4   # = head_cpu // 2
  management_api_memory: 16  # GB  = head_memory // 2

  # ── Worker groups ─────────────────────────────────────────────────────────
  # Each group defines a node type.  Workers are registered in Ray with a
  # custom resource "node_type:<node_type>" so deployments can be pinned to
  # a specific group (e.g. GPU models on t4-gpu-worker, CPU models on
  # cpu-worker) regardless of GPU/CPU availability on other nodes.
  #
  # count: workers launched automatically at cluster start.
  #        Set to 0 to register the group without launching any workers;
  #        add workers on demand via POST /api/v1/resources/nodes/add.
  #
  # runtime_identifier: overrides cai.worker_runtime_identifier per group.
  #        Use the standard (non-CUDA) image for CPU-only groups.
  worker_groups:
    - name:      l40-gpu-workers
      node_type: l40-gpu-worker
      count:     1
      cpu:       16
      memory:    64   # GB
      gpus:      1
      accelerator_type: L40S  # Ray accelerator_type label (matches nvidia-smi GPU name)
      node_label:             # K8s node selector for pod placement
        nvidia.com/gpu.product: "NVIDIA-L40S"
      # inherits cai.worker_runtime_identifier (CUDA image)

    - name:      cpu-workers
      node_type: cpu-worker
      count:     0   # none at cluster start — add on demand via Management API
      cpu:       16
      memory:    32  # GB
      gpus:      0
      runtime_identifier: "docker.repository.cloudera.com/cloudera/cdsw/ml-runtime-pbj-jupyterlab-python3.11-standard:2026.04.1-b7"

  # ── Ray daemon ports ──────────────────────────────────────────────────────
  ray_port:       6379
  dashboard_port: 8265

# ── CAI / CML Application configuration ──────────────────────────────────────
cai:
  # Docker runtime images.
  # head_runtime_identifier: CPU-only standard image for the head node (GCS + Management API).
  # worker_runtime_identifier: CUDA image for worker nodes that carry GPUs.
  #   If worker_gpus = 0, you can use the standard image instead.
  head_runtime_identifier:   "docker.repository.cloudera.com/cloudera/cdsw/ml-runtime-pbj-jupyterlab-python3.11-standard:2026.04.1-b7"
  worker_runtime_identifier: "docker.repository.cloudera.com/cloudera/cdsw/ml-runtime-pbj-jupyterlab-python3.11-cuda:2026.04.1-b7"

  project_name: "ray-cluster"

  # ── Head node CML application ──────────────────────────────────────────────
  # Name of the head node CML application.  Also used as the app subdomain.
  # The head URL is derived as https://<head_app_name>.<CDSW_DOMAIN>.
  head_app_name: "ray-cluster-head"

# ── Ray Serve proxy tuning ────────────────────────────────────────────────────
# These become RAY_SERVE_PROXY_* environment variables read by Ray Serve.
# Omit a key to keep Ray's built-in default.
ray_serve:
  # How often (s) the Serve controller checks each proxy's health.
  # proxy_health_check_period_s: 10.0

  # How long (s) to wait for a health-check response before counting a failure.
  # Three consecutive failures trigger a proxy restart.
  # proxy_health_check_timeout_s: 10.0

  # How long (s) to wait for a proxy to become ready on startup.
  # proxy_ready_check_timeout_s: 5.0

  # Minimum time (s) a proxy must drain before it is forcibly removed.
  # proxy_min_draining_period_s: 30.0

# ── Monitoring (Ray Dashboard metrics tab) ────────────────────────────────────
# Set these to the external URLs of your Prometheus and Grafana CML apps
# (created via: python cai_integration/launch_monitoring.py).
# All fields are optional — leave null to keep the metrics tab inactive.
#
# prometheus_host / grafana_host : URLs the head node can reach (http or https)
# grafana_iframe_host            : browser-accessible Grafana URL (for iframes);
#                                  usually same as grafana_host in CML
#
# Env var overrides: MONITORING_PROMETHEUS_HOST, MONITORING_GRAFANA_HOST,
#                    MONITORING_GRAFANA_IFRAME_HOST, MONITORING_GRAFANA_ORG_ID
monitoring:
  prometheus_host:     null   # e.g. https://prometheus-server.<CDSW_DOMAIN>
  grafana_host:        null   # e.g. https://grafana-server.<CDSW_DOMAIN>
  grafana_iframe_host: null   # same as grafana_host unless split-ingress
  grafana_org_id:      "1"

# ── Optional per-job environment variables ────────────────────────────────────
environment: {}
